name: 分刷酱 checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q gui_main.py treehouse_bridge.py desktop_tray.py api src/treehouse
      - run: python -m unittest tests.test_appearance tests.test_selection tests.test_filter_courses tests.test_desktop_tray tests.test_theme.ThemeConfigTest -q
        env:
          PYTHONPATH: src
      - run: python -m unittest tests.test_browser tests.test_core -q
        env:
          PYTHONPATH: src
      - run: python tools/audit/publication_guard.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, python]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      - run: pyinstaller --noconfirm --clean Fenshuajiang.spec
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'Ace-0.2.0'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'dist/分刷酱/*' $stage -Recurse -Force
          Copy-Item LICENSE, TREEHOUSE-LICENSE, 'packaging/使用说明.txt' $stage -Force
          $archive = 'Ace-0.2.0-windows-x64.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          Get-FileHash $archive -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $archive" } | Set-Content "$archive.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          name: Ace 0.2.0 · 分刷酱
          generate_release_notes: true
          files: |
            Ace-0.2.0-windows-x64.zip
            Ace-0.2.0-windows-x64.zip.sha256
