name: CourseHub checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q gui_main.py treehouse_bridge.py api src/treehouse
      - run: python -m unittest tests.test_appearance tests.test_selection tests.test_filter_courses -q
        env:
          PYTHONPATH: src
